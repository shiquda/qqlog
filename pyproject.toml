[project]
name = "qqlog"
version = "0.1.0"
description = "Local QQ NT chat history export and query CLI"
requires-python = ">=3.10"
dependencies = [
    "sqlcipher3>=0.5.0",
]

[project.scripts]
qqlog = "qqlog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qqlog"]
